name: media-generation-ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: media-generation-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npx nx show projects
      - run: npm run typecheck
      - run: npm test

  build-frontend:
    name: Build frontend image
    needs: verify
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify native architecture
        run: test "$(uname -m)" = "aarch64"
      - name: Build frontend image
        run: |
          set -euo pipefail
          test -f apps/frontend/Dockerfile
          docker build --pull -t media-frontend:verify -f apps/frontend/Dockerfile apps/frontend
          docker image inspect media-frontend:verify >/dev/null

  build-backend:
    name: Build backend image
    needs: verify
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify native architecture
        run: test "$(uname -m)" = "aarch64"
      - name: Build backend image
        run: |
          set -euo pipefail
          test -f apps/backend/Dockerfile
          docker build --pull -t media-backend:verify -f apps/backend/Dockerfile apps/backend
          docker image inspect media-backend:verify >/dev/null
