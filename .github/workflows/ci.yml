name: Media CI

on:
  push:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: media-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and build application
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Validate production release contract
        run: node scripts/validate-media-release-contract.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run backend tests
        run: npm test

      - name: Typecheck frontend and backend
        run: npm run typecheck

      - name: Build frontend and backend
        run: npm run build
