name: media-generation-ci

on:
  push:
    branches:
      - master
      - "feat/**"
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: media-generation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@1e60f620b9541dca0a4bca4c5f2f5a7e2f2e7b2
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build
      - run: npm test

  image:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/login-action@9780b0c442fbb1117ed29c6efd0c0e4f2e7c8f2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="${GITHUB_SHA}"
          docker build --pull -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"
