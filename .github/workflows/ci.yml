name: media-generation-ci

on:
  push:
    branches:
      - master
      - "feat/**"
  pull_request:

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: media-generation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notify-telegram-start:
    name: Notify Telegram — release started
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      TELEGRAM_BOT_TOKEN: ${{ vars.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
    steps:
      - name: Validate Telegram configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
      - name: Send deployment started message
        shell: bash
        run: |
          set -euo pipefail
          MESSAGE="🚀 <b>MEDIA • PRODUCTION RELEASE</b>
          🌿 Branch    <code>${{ github.ref_name }}</code>
          🔖 Commit    <code>${GITHUB_SHA::7}</code>"
          curl --fail-with-body -sS -X POST             "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"             -d "chat_id=${TELEGRAM_CHAT_ID}"             --data-urlencode "text=${MESSAGE}"             -d "parse_mode=HTML"

  detect:
    name: Resolve production image tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.version.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve immutable release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="prod-v${VERSION}-${SHA}"
          test -n "$VERSION"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Image tag: $IMAGE_TAG"

  verify:
    name: Verify Nx workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npx nx show projects
      - run: npm run typecheck
      - run: npm test
      - run: npm run build


  runtime-secret:
    needs: [verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, linux, arm64, media-generation, k3s, vps]
    environment: production
    permissions:
      contents: read
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MEDIA_STORAGE_BUCKET: media-generation
    steps:
      - uses: actions/checkout@v4
      - name: Sync production runtime secret
        run: |
          set -euo pipefail
          chmod +x scripts/sync-production-secret.sh
          ./scripts/sync-production-secret.sh

  build-frontend:
    name: Build frontend (native ARM64)
    needs: [detect, verify]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      IMAGE_TAG: ${{ needs.detect.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify native architecture
        run: test "$(uname -m)" = "aarch64"
      - name: Build frontend image
        run: docker build --pull -t "media-frontend:$IMAGE_TAG" -f apps/frontend/Dockerfile apps/frontend
      - name: Verify frontend architecture
        run: test "$(docker image inspect "media-frontend:$IMAGE_TAG" --format '{{.Architecture}}')" = "arm64"
      - name: Export and validate frontend image
        run: |
          set -euo pipefail
          docker save "media-frontend:$IMAGE_TAG" -o /tmp/media-frontend.tar
          sha256sum /tmp/media-frontend.tar > /tmp/media-frontend.sha256
          sha256sum -c /tmp/media-frontend.sha256
          tar -tf /tmp/media-frontend.tar >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: media-frontend-image
          path: |
            /tmp/media-frontend.tar
            /tmp/media-frontend.sha256
          retention-days: 1

  build-backend:
    name: Build backend (native ARM64)
    needs: [detect, verify]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      IMAGE_TAG: ${{ needs.detect.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify native architecture
        run: test "$(uname -m)" = "aarch64"
      - name: Build backend image
        run: docker build --pull -t "media-backend:$IMAGE_TAG" -f apps/backend/Dockerfile apps/backend
      - name: Verify backend architecture
        run: test "$(docker image inspect "media-backend:$IMAGE_TAG" --format '{{.Architecture}}')" = "arm64"
      - name: Export and validate backend image
        run: |
          set -euo pipefail
          docker save "media-backend:$IMAGE_TAG" -o /tmp/media-backend.tar
          sha256sum /tmp/media-backend.tar > /tmp/media-backend.sha256
          sha256sum -c /tmp/media-backend.sha256
          tar -tf /tmp/media-backend.tar >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: media-backend-image
          path: |
            /tmp/media-backend.tar
            /tmp/media-backend.sha256
          retention-days: 1

  platform-infra-release:
    name: Publish immutable images and promote platform-infra
    needs: [detect, build-frontend, build-backend]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      TAG: ${{ needs.detect.outputs.image_tag }}
      TOKEN: ${{ secrets.PLATFORM_INFRA_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: media-*-image
          merge-multiple: true
          path: /tmp/images
      - name: Load and validate exact release images
        run: |
          set -euo pipefail
          for image in media-frontend media-backend; do
            test -s "/tmp/images/$image.tar"
            test -s "/tmp/images/$image.sha256"
            sha256sum -c "/tmp/images/$image.sha256"
            docker load -i "/tmp/images/$image.tar"
            docker image inspect "$image:$TAG" >/dev/null
            test "$(docker image inspect "$image:$TAG" --format '{{.Architecture}}')" = "arm64"
          done
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish exact release images
        run: |
          set -euo pipefail
          docker tag "media-frontend:$TAG" "ghcr.io/phanthienquoc/media-generation-frontend:$TAG"
          docker tag "media-backend:$TAG" "ghcr.io/phanthienquoc/media-generation-backend:$TAG"
          docker push "ghcr.io/phanthienquoc/media-generation-frontend:$TAG"
          docker push "ghcr.io/phanthienquoc/media-generation-backend:$TAG"
      - name: Notify platform-infra
        id: dispatch
        run: |
          set -euo pipefail
          test -n "$TOKEN"
          DISPATCHED_AT="$(date -u +%s)"
          echo "dispatched_at=$DISPATCHED_AT" >> "$GITHUB_OUTPUT"
          curl --fail-with-body -sS -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             https://api.github.com/repos/phanthienquoc/platform-infra/dispatches             -d "{"event_type":"media-release-requested","client_payload":{"app":"media-generation","release":"$TAG"}}"
      - name: Verify platform-infra release workflow
        env:
          RELEASE: ${{ needs.detect.outputs.image_tag }}
          DISPATCHED_AT: ${{ steps.dispatch.outputs.dispatched_at }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            RUNS_JSON="$(curl --fail-with-body -sS               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer $TOKEN"               https://api.github.com/repos/phanthienquoc/platform-infra/actions/runs?event=repository_dispatch\&per_page=20)"
            MATCH="$(printf '%s' "$RUNS_JSON" | jq -r --argjson cutoff "$DISPATCHED_AT" '
              .workflow_runs[]
              | select(.created_at != null)
              | select((.created_at | fromdateiso8601) >= ($cutoff - 5))
              | select(.name | startswith("GitOps Image Promotion"))
              | [.id, .name, .status, .html_url] | @tsv
            ')"
            if [ -n "$MATCH" ]; then
              echo "$MATCH"
              exit 0
            fi
            sleep 5
          done
          echo "::error::platform-infra did not schedule the media release promotion workflow."
          exit 1
