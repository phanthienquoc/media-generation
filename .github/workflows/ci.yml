name: media-generation-ci

on:
  push:
    branches:
      - master
      - "feat/**"
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: media-generation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: bash -n scripts/sync-production-secret.sh

  runtime-secret:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    uses: phanthienquoc/platform-infra/.github/workflows/sync-media-runtime-secret.yml@450f461d8e2d49579471dbcbc904ceb225259e91
    secrets:
      gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
      supabase_url: ${{ secrets.SUPABASE_URL }}
      supabase_service_role_key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  image:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="${GITHUB_SHA}"
          docker build --pull -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"

  promote:
    needs: [image, runtime-secret]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Dispatch GitOps image promotion
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_INFRA_DISPATCH_TOKEN }}
          PLATFORM_INFRA_REPO: phanthienquoc/platform-infra
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN}" || {
            echo "::error::PLATFORM_INFRA_DISPATCH_TOKEN is required for production image promotion"
            exit 1
          }
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${PLATFORM_INFRA_REPO}/dispatches" \
            -f event_type="image-published" \
            -f client_payload[app]="media-generation" \
            -f client_payload[component]="app" \
            -f client_payload[tag]="${IMAGE_TAG}"
          echo "Dispatched media-generation image promotion for ${IMAGE_TAG}."
