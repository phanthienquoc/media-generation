name: WF-03 Media Production Deploy
# Re-registered under a new workflow path to clear the stale Actions metadata.
run-name: WF-03 Media Production Deploy — ${{ github.ref_name }} — ${{ github.sha }}

on:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - '**/*.md'
      - 'scripts/validate-media-release-contract.mjs'
      - 'scripts/verify-ghcr-tags-absent.sh'
      - 'scripts/tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: media-production-publish-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate-release-ref:
    name: Require master for production release
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-master production releases
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "::error::Production image publication must run from master; refusing image publication."
            exit 1
          fi

  notify-telegram-start:
    needs: validate-release-ref
    name: Notify Telegram — release started
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Validate Telegram configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "Missing GitHub secret: TELEGRAM_BOT_TOKEN"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "Missing GitHub secret: TELEGRAM_CHAT_ID"; exit 1; }

      - name: Send deployment started message
        shell: bash
        run: |
          set -euo pipefail
          MESSAGE="🚀 <b>MEDIA • PRODUCTION RELEASE</b>
          🌿 Branch    <code>${{ github.ref_name }}</code>
          🔖 Commit    <code>${GITHUB_SHA::7}</code>"

          curl --fail-with-body -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            -d "parse_mode=HTML"

  detect:
    name: Resolve production image tag
    needs: notify-telegram-start
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.version.outputs.image_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve immutable release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version must be stable semver (x.y.z); got: $VERSION"
            exit 1
          fi

          SHA="$GITHUB_SHA"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Expected full immutable 40-character Git SHA"
            exit 1
          }
          IMAGE_TAG="prod-v${VERSION}-${SHA}"

          test "$IMAGE_TAG" = "prod-v${VERSION}-${SHA}"

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Image tag: $IMAGE_TAG"

      - name: Write release metadata
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.version.outputs.image_tag }}
        run: |
          set -euo pipefail
          printf '%s\n' "$IMAGE_TAG" > /tmp/image-tag.txt

      - name: Upload release metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: media-release-metadata
          path: /tmp/image-tag.txt
          retention-days: 1

  build-frontend:
    name: Build frontend (native ARM64)
    needs: detect
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      IMAGE_TAG: ${{ needs.detect.outputs.image_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify native architecture
        run: test "$(uname -m)" = "aarch64"

      - name: Build frontend image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull -t "media-frontend:$IMAGE_TAG" -f apps/frontend/Dockerfile apps/frontend

      - name: Verify frontend architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect "media-frontend:$IMAGE_TAG" --format '{{.Architecture}}')" = "arm64"

      - name: Export and validate frontend image
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/media-frontend.tar /tmp/media-frontend.sha256
          docker save "media-frontend:$IMAGE_TAG" -o /tmp/media-frontend.tar
          test -s /tmp/media-frontend.tar
          sha256sum /tmp/media-frontend.tar > /tmp/media-frontend.sha256
          sha256sum -c /tmp/media-frontend.sha256
          tar -tf /tmp/media-frontend.tar >/dev/null

      - name: Upload frontend image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: media-frontend-image
          path: |
            /tmp/media-frontend.tar
            /tmp/media-frontend.sha256
          retention-days: 1

  build-backend:
    name: Build backend (native ARM64)
    needs: detect
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      IMAGE_TAG: ${{ needs.detect.outputs.image_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate backend inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/backend/Dockerfile
          test -f package.json
          test -f apps/backend/package.json
          test -d apps/backend

      - name: Verify native architecture
        run: test "$(uname -m)" = "aarch64"

      - name: Build backend image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull -t "media-backend:$IMAGE_TAG" -f apps/backend/Dockerfile apps/backend

      - name: Verify backend architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect "media-backend:$IMAGE_TAG" --format '{{.Architecture}}')" = "arm64"

      - name: Export and validate backend image
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/media-backend.tar /tmp/media-backend.sha256
          docker save "media-backend:$IMAGE_TAG" -o /tmp/media-backend.tar
          test -s /tmp/media-backend.tar
          sha256sum /tmp/media-backend.tar > /tmp/media-backend.sha256
          sha256sum -c /tmp/media-backend.sha256
          tar -tf /tmp/media-backend.tar >/dev/null

      - name: Upload backend image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: media-backend-image
          path: |
            /tmp/media-backend.tar
            /tmp/media-backend.sha256
          retention-days: 1

  publish-immutable-images:
    name: Publish immutable images to GHCR
    needs:
      - detect
      - build-frontend
      - build-backend
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      TAG: ${{ needs.detect.outputs.image_tag }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download exact release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: media-*-image
          merge-multiple: true
          path: /tmp/images

      - name: Load and validate exact release images
        shell: bash
        run: |
          set -euo pipefail

          for image in media-frontend media-backend; do
            test -s "/tmp/images/$image.tar"
            test -s "/tmp/images/$image.sha256"
            expected="$(awk '{print $1}' "/tmp/images/$image.sha256")"
            actual="$(sha256sum "/tmp/images/$image.tar" | awk '{print $1}')"
            test "$actual" = "$expected" || {
              echo "::error::Checksum mismatch for $image.tar"
              echo "Expected: $expected"
              echo "Actual:   $actual"
              exit 1
            }
            docker load -i "/tmp/images/$image.tar"
            docker image inspect "$image:$TAG" >/dev/null
            test "$(docker image inspect "$image:$TAG" --format '{{.Architecture}}')" = "arm64"
          done

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx for registry digest inspection
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Refuse to overwrite existing immutable GHCR release tags
        env:
          REPOSITORY: phanthienquoc/media-generation
          RELEASE_TAG: ${{ needs.detect.outputs.image_tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: bash scripts/verify-ghcr-tags-absent.sh "$REPOSITORY" "$RELEASE_TAG" "$SOURCE_SHA"

      - name: Publish exact release images
        shell: bash
        run: |
          set -euo pipefail

          FRONTEND_IMAGE="ghcr.io/phanthienquoc/media-generation/frontend:$TAG"
          BACKEND_IMAGE="ghcr.io/phanthienquoc/media-generation/backend:$TAG"

          docker tag "media-frontend:$TAG" "$FRONTEND_IMAGE"
          docker tag "media-backend:$TAG" "$BACKEND_IMAGE"

          docker push "$FRONTEND_IMAGE"
          docker push "$BACKEND_IMAGE"

      - name: Verify immutable registry digests and ARM64 manifests
        id: image-digests
        shell: bash
        env:
          TAG: ${{ needs.detect.outputs.image_tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^prod-v[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{40}$ ]] || {
            echo "::error::Expected a release tag containing the full source SHA before registry verification." >&2
            exit 1
          }

          for component in frontend backend; do
            image="ghcr.io/phanthienquoc/media-generation/$component:$TAG"
            inspect="$(docker buildx imagetools inspect "$image")"
            if ! grep -Eq 'Platform: linux/arm64|linux/arm64' <<< "$inspect"; then
              echo "::error::Published image $image has no linux/arm64 manifest." >&2
              printf '%s\n' "$inspect" >&2
              exit 1
            fi

            digest="$(awk '/^Digest:/ {print $2; exit}' <<< "$inspect")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "::error::Unable to resolve immutable registry digest for $image." >&2
              printf '%s\n' "$inspect" >&2
              exit 1
            }
            echo "${component}_digest=$digest" >> "$GITHUB_OUTPUT"
            echo "Verified $component: $digest (linux/arm64)"
          done

          [[ -n "$(grep '^frontend_digest=sha256:' "$GITHUB_OUTPUT" || true)" ]]
          [[ -n "$(grep '^backend_digest=sha256:' "$GITHUB_OUTPUT" || true)" ]]

      - name: Write release summary
        shell: bash
        env:
          FRONTEND_DIGEST: ${{ steps.image-digests.outputs.frontend_digest }}
          BACKEND_DIGEST: ${{ steps.image-digests.outputs.backend_digest }}
        run: |
          set -euo pipefail
          {
            echo "### Immutable GHCR publication"
            echo ""
            echo "- Tag: $TAG"
            echo "- Frontend: ghcr.io/phanthienquoc/media-generation/frontend:$TAG"
            echo "- Frontend digest: $FRONTEND_DIGEST"
            echo "- Backend: ghcr.io/phanthienquoc/media-generation/backend:$TAG"
            echo "- Backend digest: $BACKEND_DIGEST"
            echo "- Architecture: linux/arm64 verified"
            echo "- Platform deployment: not configured; no repository dispatch was sent"
          } >> "$GITHUB_STEP_SUMMARY"
