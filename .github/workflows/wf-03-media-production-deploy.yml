name: WF-03 Media Production Deploy
# Re-registered under a new workflow path to clear the stale Actions metadata.
run-name: WF-03 Media Production Deploy — ${{ github.ref_name }} — ${{ github.sha }}

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  notify-telegram-start:
    name: Notify Telegram — release started
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ vars.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
    steps:
      - name: Validate Telegram configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "Missing GitHub variable: TELEGRAM_BOT_TOKEN"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "Missing GitHub variable: TELEGRAM_CHAT_ID"; exit 1; }

      - name: Send deployment started message
        shell: bash
        run: |
          set -euo pipefail
          MESSAGE="🚀 <b>MEDIA • PRODUCTION RELEASE</b>
          🌿 Branch    <code>${{ github.ref_name }}</code>
          🔖 Commit    <code>${GITHUB_SHA::7}</code>"

          curl --fail-with-body -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            -d "parse_mode=HTML"

  detect:
    name: Resolve production image tag
    needs: notify-telegram-start
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.version.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve immutable release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="prod-v${VERSION}-${SHA}"

          test -n "$VERSION"
          test "$IMAGE_TAG" = "prod-v${VERSION}-${SHA}"

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Image tag: $IMAGE_TAG"

      - name: Write release metadata
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.version.outputs.image_tag }}
        run: |
          set -euo pipefail
          printf '%s\n' "$IMAGE_TAG" > /tmp/image-tag.txt

      - name: Upload release metadata
        uses: actions/upload-artifact@v4
        with:
          name: media-release-metadata
          path: /tmp/image-tag.txt
          retention-days: 1

  build-frontend:
    name: Build frontend (native ARM64)
    needs: detect
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      IMAGE_TAG: ${{ needs.detect.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify native architecture
        run: test "$(uname -m)" = "aarch64"

      - name: Build frontend image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull -t "media-frontend:$IMAGE_TAG" -f apps/frontend/Dockerfile apps/frontend

      - name: Verify frontend architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect "media-frontend:$IMAGE_TAG" --format '{{.Architecture}}')" = "arm64"

      - name: Export and validate frontend image
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/media-frontend.tar /tmp/media-frontend.sha256
          docker save "media-frontend:$IMAGE_TAG" -o /tmp/media-frontend.tar
          test -s /tmp/media-frontend.tar
          sha256sum /tmp/media-frontend.tar > /tmp/media-frontend.sha256
          sha256sum -c /tmp/media-frontend.sha256
          tar -tf /tmp/media-frontend.tar >/dev/null

      - name: Upload frontend image
        uses: actions/upload-artifact@v4
        with:
          name: media-frontend-image
          path: |
            /tmp/media-frontend.tar
            /tmp/media-frontend.sha256
          retention-days: 1

  build-backend:
    name: Build backend (native ARM64)
    needs: detect
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      IMAGE_TAG: ${{ needs.detect.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate backend inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/backend/Dockerfile
          test -f package.json
          test -f apps/backend/package.json
          test -d apps/backend
          test -d libs
          test -d packages

      - name: Verify native architecture
        run: test "$(uname -m)" = "aarch64"

      - name: Build backend image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull -t "media-backend:$IMAGE_TAG" -f apps/service/Dockerfile .

      - name: Verify backend architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect "media-backend:$IMAGE_TAG" --format '{{.Architecture}}')" = "arm64"

      - name: Export and validate backend image
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/media-backend.tar /tmp/media-backend.sha256
          docker save "media-backend:$IMAGE_TAG" -o /tmp/media-backend.tar
          test -s /tmp/media-backend.tar
          sha256sum /tmp/media-backend.tar > /tmp/media-backend.sha256
          sha256sum -c /tmp/media-backend.sha256
          tar -tf /tmp/media-backend.tar >/dev/null

      - name: Upload backend image
        uses: actions/upload-artifact@v4
        with:
          name: media-backend-image
          path: |
            /tmp/media-backend.tar
            /tmp/media-backend.sha256
          retention-days: 1

  platform-infra-release:
    name: Publish immutable images and promote platform-infra
    needs:
      - detect
      - build-frontend
      - build-backend
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      TAG: ${{ needs.detect.outputs.image_tag }}
      TOKEN: ${{ secrets.PLATFORM_INFRA_DISPATCH_TOKEN }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4

      - name: Download exact release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tce-*-image
          merge-multiple: true
          path: /tmp/images

      - name: Load and validate exact release images
        shell: bash
        run: |
          set -euo pipefail

          for image in media-frontend media-backend; do
            test -s "/tmp/images/$image.tar"
            test -s "/tmp/images/$image.sha256"
            expected="$(awk '{print $1}' "/tmp/images/$image.sha256")"
            actual="$(sha256sum "/tmp/images/$image.tar" | awk '{print $1}')"
            test "$actual" = "$expected" || {
              echo "::error::Checksum mismatch for $image.tar"
              echo "Expected: $expected"
              echo "Actual:   $actual"
              exit 1
            }
            docker load -i "/tmp/images/$image.tar"
            docker image inspect "$image:$TAG" >/dev/null
            test "$(docker image inspect "$image:$TAG" --format '{{.Architecture}}')" = "arm64"
          done

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish exact release images
        shell: bash
        run: |
          set -euo pipefail

          FRONTEND_IMAGE="ghcr.io/phanthienquoc/media-generation/frontend:$TAG"
          BACKEND_IMAGE="ghcr.io/phanthienquoc/media-generation/backend:$TAG"

          docker tag "media-frontend:$TAG" "$FRONTEND_IMAGE"
          docker tag "media-backend:$TAG" "$BACKEND_IMAGE"

          docker push "$FRONTEND_IMAGE"
          docker push "$BACKEND_IMAGE"

      - name: Notify platform-infra
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail

          test -n "$TOKEN" || {
            echo "PLATFORM_INFRA_DISPATCH_TOKEN is required for production GitOps promotion."
            exit 1
          }

          DISPATCHED_AT="$(date -u +%s)"
          echo "dispatched_at=$DISPATCHED_AT" >> "$GITHUB_OUTPUT"

          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/phanthienquoc/platform-infra/dispatches \
            -d "{\"event_type\":\"media-release-requested\",\"client_payload\":{\"app\":\"media-generation\",\"release\":\"$TAG\"}}"

      - name: Verify platform-infra release workflow
        shell: bash
        env:
          RELEASE: ${{ needs.detect.outputs.image_tag }}
          DISPATCHED_AT: ${{ steps.dispatch.outputs.dispatched_at }}
        run: |
          set -euo pipefail

          REPO="phanthienquoc/platform-infra"
          API="https://api.github.com/repos/$REPO/actions/runs"

          echo "Waiting for platform-infra repository_dispatch for $RELEASE..."

          for attempt in $(seq 1 12); do
            RUNS_JSON="$(curl --fail-with-body -sS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API?event=repository_dispatch&per_page=20")"

            MATCH="$(printf '%s' "$RUNS_JSON" | jq -r --argjson cutoff "$DISPATCHED_AT" '
              .workflow_runs[]
              | select(.created_at != null)
              | select((.created_at | fromdateiso8601) >= ($cutoff - 5))
              | select(.name | startswith("GitOps Image Promotion"))
              | [.id, .name, .status, .html_url]
              | @tsv
            ')"


            if [ -n "$MATCH" ]; then
              echo "Platform-infra workflow scheduled: $MATCH"
              exit 0
            fi

            echo "No matching platform-infra repository_dispatch workflow yet (attempt $attempt/12)."
            sleep 5
          done

          echo "::error::GitHub accepted the dispatch request, but platform-infra did not schedule the GitOps Image Promotion workflow within 60 seconds."
          echo "::error::Check PLATFORM_INFRA_DISPATCH_TOKEN permissions and the platform-infra Actions workflow state."
          exit 1

      - name: Write release summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Platform Infra image release"
            echo ""
            echo "- Tag: $TAG"
            echo "- Web: ghcr.io/phanthienquoc/media-generation/web:$TAG"
            echo "- Service: ghcr.io/phanthienquoc/media-generation/service:$TAG"
            echo "- Event: media-release-requested"
            echo "- Platform Infra: release request dispatched and GitOps Image Promotion workflow verified"
          } >> "$GITHUB_STEP_SUMMARY"
